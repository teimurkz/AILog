server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"service":"silk-road-web","status":"ok"}';
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API calls use the existing Firebase function URL, never the SPA fallback.
    location = /api { return 404; }
    location /api/ { return 404; }
    location ~ /\. { return 404; }

    # Opening a CRM route directly must load the application entry page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
